<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parkrun Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-container {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 380px;
        }
        h1 {
            font-size: 24px;
            margin-bottom: 10px;
            color: #1a1a1a;
            text-align: center;
        }
        .subtitle {
            color: #666;
            text-align: center;
            margin-bottom: 30px;
            font-size: 14px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #333;
            font-size: 14px;
        }
        input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            transition: border-color 0.3s;
        }
        input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        button {
            width: 100%;
            padding: 12px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover {
            background: #5568d3;
        }
        button:active {
            transform: translateY(1px);
        }
        .error {
            color: #d32f2f;
            font-size: 13px;
            margin-top: 10px;
            display: none;
        }
        .info {
            background: #f5f5f5;
            padding: 12px;
            border-radius: 6px;
            font-size: 12px;
            color: #666;
            margin-top: 20px;
            border-left: 3px solid #667eea;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <h1>🏃 Parkrun Dashboard</h1>
        <p class="subtitle">Alphabet Challenge Tracker</p>

        <form id="loginForm">
            <div class="form-group">
                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    placeholder="Enter password"
                    autocomplete="off"
                    required
                >
            </div>
            <button type="submit">Access Dashboard</button>
            <div class="error" id="error">Incorrect password</div>
        </form>

        <div class="info">
            💡 Password is case-sensitive. Contact Lisa for access.
        </div>
    </div>

    <script>
        // CHANGE THIS PASSWORD
        const DASHBOARD_PASSWORD = 'parkrun2024';

        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const password = document.getElementById('password').value;

            if (password === DASHBOARD_PASSWORD) {
                // Store auth in sessionStorage (cleared when browser closes)
                sessionStorage.setItem('parkrunAuth', 'true');
                window.location.href = '/dashboard.html';
            } else {
                document.getElementById('error').style.display = 'block';
                document.getElementById('password').value = '';
                document.getElementById('password').focus();
            }
        });

        // If already authenticated, go straight to dashboard
        if (sessionStorage.getItem('parkrunAuth') === 'true') {
            window.location.href = '/dashboard.html';
        }
    </script>
</body>
</html>
